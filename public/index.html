<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIZZIA — Nouvelle commande</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <span class="logo">PIZZIA</span>
    <div class="nav-links">
      <a href="/kitchen.html" class="btn btn-sm">Cuisine</a>
      <a href="/stats.html" class="btn btn-sm">Stats</a>
      <a href="/logout" class="btn btn-sm btn-ghost">Déconnexion</a>
    </div>
  </nav>

  <main class="container">
    <h2 class="page-title">Nouvelle commande</h2>

    <div id="success-banner" class="success-banner" style="display:none"></div>

    <form id="order-form" class="order-form">

      <div class="form-row">
        <div class="form-group">
          <label for="client">Nom du client</label>
          <input type="text" id="client" name="client" placeholder="Ex: Martin" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="section-label">Numéro de bipeur</label>
          <div id="buzzer-grid" class="buzzer-grid"></div>
          <input type="hidden" id="buzzer" name="buzzer">
        </div>
      </div>
      <div id="identity-error" class="error-msg" style="display:none">Indiquez un nom ou un numéro de bipeur</div>

      <div class="form-group">
        <label class="section-label">🍕 Pizzas</label>
        <div id="pizza-list" class="pizza-grid"></div>
      </div>

      <div class="form-group">
        <label class="section-label">🫙 Tapas</label>
        <div id="tapas-list" class="pizza-grid"></div>
      </div>

      <div id="items-error" class="error-msg" style="display:none">Sélectionnez au moins un article</div>

      <div class="form-group">
        <label for="comment">Commentaire</label>
        <textarea id="comment" name="comment" rows="2" placeholder="Ex: sans oignon sur la Regina"></textarea>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-send btn-full btn-floating">Envoyer la commande</button>
    </form>
  </main>

  <script>
    (async () => {
      const res = await fetch('/orders');
      if (res.status === 401) window.location.href = '/pin.html';
    })();

    const quantities = {};
    let activeOrders = [];
    const freedBuzzers = new Set();
    const BUZZER_TTL_MS = 60 * 60 * 1000; // 1 heure

    function getUsedBuzzers() {
      const now = Date.now();
      return new Set(
        activeOrders
          .filter(o => o.buzzer && !freedBuzzers.has(o.buzzer) &&
                       (now - new Date(o.timestamp).getTime()) < BUZZER_TTL_MS)
          .map(o => o.buzzer)
      );
    }

    async function loadOrders() {
      const res = await fetch('/orders');
      if (!res.ok) return;
      activeOrders = await res.json();
      renderBuzzerGrid();
    }

    function makeCounterGrid(items, containerId) {
      const grid = document.getElementById(containerId);
      grid.innerHTML = '';
      items.forEach(name => {
        if (!(name in quantities)) quantities[name] = 0;
        const card = document.createElement('div');
        card.className = 'pizza-counter';
        card.dataset.name = name;
        card.innerHTML = `
          <span class="pizza-name">${name}</span>
          <div class="counter-controls">
            <button type="button" class="counter-btn minus" data-name="${name}" aria-label="Moins">−</button>
            <span class="counter-value" id="qty-${CSS.escape(name)}">0</span>
            <button type="button" class="counter-btn plus" data-name="${name}" aria-label="Plus">+</button>
          </div>`;
        grid.appendChild(card);
      });

      grid.addEventListener('click', e => {
        const btn = e.target.closest('.counter-btn');
        if (!btn) return;
        const name = btn.dataset.name;
        if (btn.classList.contains('plus')) {
          quantities[name] = (quantities[name] || 0) + 1;
        } else {
          quantities[name] = Math.max(0, (quantities[name] || 0) - 1);
        }
        updateCard(name);
        document.getElementById('items-error').style.display = 'none';
      });
    }

    async function loadMenu() {
      const [rp, rt] = await Promise.all([
        fetch('/config-pizzas'),
        fetch('/config-tapas')
      ]);
      if (rp.ok) makeCounterGrid(await rp.json(), 'pizza-list');
      if (rt.ok) makeCounterGrid(await rt.json(), 'tapas-list');
    }

    function updateCard(name) {
      const qty = quantities[name] || 0;
      const card = document.querySelector(`.pizza-counter[data-name="${CSS.escape(name)}"]`);
      const display = document.getElementById('qty-' + CSS.escape(name));
      if (!card || !display) return;
      display.textContent = qty;
      card.classList.toggle('active', qty > 0);
    }

    function renderBuzzerGrid() {
      const usedBuzzers = getUsedBuzzers();
      const selected = Number(document.getElementById('buzzer').value) || null;
      const grid = document.getElementById('buzzer-grid');
      grid.innerHTML = '';
      for (let i = 1; i <= 30; i++) {
        const isUsed = usedBuzzers.has(i);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'buzzer-btn' +
          (isUsed ? ' used' : '') +
          (selected === i ? ' selected' : '');
        btn.textContent = i;
        btn.dataset.num = i;
        if (!isUsed) {
          btn.addEventListener('click', () => toggleBuzzer(i));
        } else {
          attachLongPress(btn, i);
        }
        grid.appendChild(btn);
      }
    }

    function toggleBuzzer(n) {
      const input = document.getElementById('buzzer');
      const current = Number(input.value) || null;
      input.value = current === n ? '' : n;
      renderBuzzerGrid();
      document.getElementById('identity-error').style.display = 'none';
    }

    function attachLongPress(btn, n) {
      let timer = null;
      let animFrame = null;
      const DURATION = 600;

      function start(e) {
        e.preventDefault();
        btn.classList.add('pressing');
        btn.style.setProperty('--press-duration', DURATION + 'ms');
        timer = setTimeout(() => {
          freedBuzzers.add(n);
          btn.classList.remove('pressing');
          btn.classList.add('freed');
          if (navigator.vibrate) navigator.vibrate(40);
          setTimeout(() => renderBuzzerGrid(), 350);
        }, DURATION);
      }

      function cancel() {
        clearTimeout(timer);
        btn.classList.remove('pressing');
      }

      btn.addEventListener('pointerdown', start);
      btn.addEventListener('pointerup', cancel);
      btn.addEventListener('pointerleave', cancel);
      btn.addEventListener('contextmenu', e => e.preventDefault());
    }

    function resetForm() {
      document.getElementById('client').value = '';
      document.getElementById('buzzer').value = '';
      document.getElementById('comment').value = '';
      Object.keys(quantities).forEach(name => {
        quantities[name] = 0;
        updateCard(name);
      });
      renderBuzzerGrid();
    }

    document.getElementById('order-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      document.getElementById('identity-error').style.display = 'none';
      document.getElementById('items-error').style.display = 'none';

      const client  = document.getElementById('client').value.trim();
      const buzzer  = document.getElementById('buzzer').value;
      const comment = document.getElementById('comment').value.trim();

      const pizzaNames = Array.from(document.querySelectorAll('#pizza-list .pizza-counter')).map(c => c.dataset.name);
      const tapasNames = Array.from(document.querySelectorAll('#tapas-list .pizza-counter')).map(c => c.dataset.name);

      const pizzas = pizzaNames.flatMap(n => Array(quantities[n] || 0).fill(n));
      const tapas  = tapasNames.flatMap(n => Array(quantities[n] || 0).fill(n));

      let valid = true;
      if (!client && !buzzer) { document.getElementById('identity-error').style.display = 'block'; valid = false; }
      if (pizzas.length === 0 && tapas.length === 0) { document.getElementById('items-error').style.display = 'block'; valid = false; }
      if (!valid) return;

      const body = { pizzas, tapas, comment };
      if (client) body.client = client;
      if (buzzer) body.buzzer = Number(buzzer);

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.classList.add('sending');
      btn.textContent = 'Envoi en cours…';

      try {
        const res = await fetch('/order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (res.ok) {
          const order = await res.json();
          const label = order.client || `Bipeur ${order.buzzer}`;
          btn.classList.remove('sending');
          btn.classList.add('sent');
          btn.textContent = '✓ Commande envoyée !';
          const banner = document.getElementById('success-banner');
          banner.textContent = `Commande #${order.id} pour ${label} envoyée !`;
          banner.style.display = 'block';
          resetForm();
          setTimeout(() => { banner.style.display = 'none'; }, 4000);
          setTimeout(() => {
            btn.disabled = false;
            btn.classList.remove('sent');
            btn.textContent = 'Envoyer la commande';
          }, 2000);
          await loadOrders();
        } else {
          const err = await res.json();
          btn.disabled = false;
          btn.classList.remove('sending');
          btn.textContent = 'Envoyer la commande';
          alert('Erreur : ' + err.error);
        }
      } catch {
        btn.disabled = false;
        btn.classList.remove('sending');
        btn.textContent = 'Envoyer la commande';
        alert('Erreur réseau');
      }
    });

    loadMenu();
    loadOrders();
    renderBuzzerGrid();
  </script>
</body>
</html>
