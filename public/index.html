<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIZZIA — Nouvelle commande</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <span class="logo">PIZZIA</span>
    <div class="nav-links">
      <a href="/kitchen.html" class="btn btn-sm">Cuisine</a>
      <a href="/logout" class="btn btn-sm btn-ghost">Déconnexion</a>
    </div>
  </nav>

  <main class="container">
    <h2 class="page-title">Nouvelle commande</h2>

    <div id="success-banner" class="success-banner" style="display:none"></div>

    <form id="order-form" class="order-form">

      <div class="form-row">
        <div class="form-group">
          <label for="client">Nom du client</label>
          <input type="text" id="client" name="client" placeholder="Ex: Martin" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="buzzer">Numéro de bipeur</label>
          <input type="number" id="buzzer" name="buzzer" min="1" max="30" placeholder="1–30">
          <div id="buzzer-suggestions" class="suggestions"></div>
        </div>
      </div>
      <div id="identity-error" class="error-msg" style="display:none">Indiquez un nom ou un numéro de bipeur</div>

      <div class="form-group">
        <label>Pizzas <span class="required">*</span></label>
        <div id="pizza-list" class="pizza-grid"></div>
        <div id="pizza-error" class="error-msg" style="display:none">Sélectionnez au moins une pizza</div>
      </div>

      <div class="form-group">
        <label for="comment">Commentaire</label>
        <textarea id="comment" name="comment" rows="2" placeholder="Ex: sans oignon sur la Reine"></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-full">Envoyer la commande</button>
    </form>
  </main>

  <script>
    (async () => {
      const res = await fetch('/orders');
      if (res.status === 401) window.location.href = '/pin.html';
    })();

    const quantities = {};  // { pizzaName: count }
    let activeOrders = [];

    async function loadOrders() {
      const res = await fetch('/orders');
      if (!res.ok) return;
      activeOrders = await res.json();
      renderBuzzerSuggestions();
    }

    async function loadPizzas() {
      const res = await fetch('/config-pizzas');
      if (!res.ok) return;
      const pizzas = await res.json();
      pizzas.forEach(p => { quantities[p] = 0; });
      renderPizzas(pizzas);
    }

    function renderPizzas(pizzas) {
      const grid = document.getElementById('pizza-list');
      grid.innerHTML = '';
      pizzas.forEach(name => {
        const card = document.createElement('div');
        card.className = 'pizza-counter';
        card.dataset.name = name;
        card.innerHTML = `
          <span class="pizza-name">${name}</span>
          <div class="counter-controls">
            <button type="button" class="counter-btn minus" data-name="${name}" aria-label="Moins">−</button>
            <span class="counter-value" id="qty-${CSS.escape(name)}">0</span>
            <button type="button" class="counter-btn plus" data-name="${name}" aria-label="Plus">+</button>
          </div>`;
        grid.appendChild(card);
      });

      grid.addEventListener('click', e => {
        const btn = e.target.closest('.counter-btn');
        if (!btn) return;
        const name = btn.dataset.name;
        if (btn.classList.contains('plus')) {
          quantities[name] = (quantities[name] || 0) + 1;
        } else {
          quantities[name] = Math.max(0, (quantities[name] || 0) - 1);
        }
        updateCard(name);
        document.getElementById('pizza-error').style.display = 'none';
      });
    }

    function updateCard(name) {
      const qty = quantities[name] || 0;
      const card = document.querySelector(`.pizza-counter[data-name="${name}"]`);
      const display = document.getElementById('qty-' + CSS.escape(name));
      if (!card || !display) return;
      display.textContent = qty;
      card.classList.toggle('active', qty > 0);
    }

    function renderBuzzerSuggestions() {
      const usedBuzzers = new Set(activeOrders.map(o => o.buzzer).filter(Boolean));
      const free = [];
      for (let i = 1; i <= 30 && free.length < 6; i++) {
        if (!usedBuzzers.has(i)) free.push(i);
      }
      const el = document.getElementById('buzzer-suggestions');
      el.innerHTML = free.length
        ? 'Libres : ' + free.map(n =>
            `<button type="button" class="suggestion-chip" onclick="setBuzzer(${n})">${n}</button>`
          ).join('')
        : '';
    }

    window.setBuzzer = (n) => { document.getElementById('buzzer').value = n; };

    function resetForm() {
      document.getElementById('client').value = '';
      document.getElementById('buzzer').value = '';
      document.getElementById('comment').value = '';
      Object.keys(quantities).forEach(name => {
        quantities[name] = 0;
        updateCard(name);
      });
    }

    document.getElementById('order-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const identityError = document.getElementById('identity-error');
      const pizzaError = document.getElementById('pizza-error');
      identityError.style.display = 'none';
      pizzaError.style.display = 'none';

      const client = document.getElementById('client').value.trim();
      const buzzer = document.getElementById('buzzer').value;
      const comment = document.getElementById('comment').value.trim();

      // Build pizzas array with repetitions for quantities
      const pizzas = Object.entries(quantities)
        .flatMap(([name, qty]) => Array(qty).fill(name));

      let valid = true;
      if (!client && !buzzer) { identityError.style.display = 'block'; valid = false; }
      if (pizzas.length === 0) { pizzaError.style.display = 'block'; valid = false; }
      if (!valid) return;

      const body = { pizzas, comment };
      if (client) body.client = client;
      if (buzzer) body.buzzer = Number(buzzer);

      try {
        const res = await fetch('/order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (res.ok) {
          const order = await res.json();
          const label = order.client || `Bipeur ${order.buzzer}`;
          const banner = document.getElementById('success-banner');
          banner.textContent = `Commande #${order.id} pour ${label} envoyée !`;
          banner.style.display = 'block';
          resetForm();
          setTimeout(() => { banner.style.display = 'none'; }, 4000);
          await loadOrders();
        } else {
          const err = await res.json();
          alert('Erreur : ' + err.error);
        }
      } catch {
        alert('Erreur réseau');
      }
    });

    loadPizzas();
    loadOrders();
  </script>
</body>
</html>
