<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIZZIA — Cuisine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <span class="logo">PIZZIA</span>
    <div class="nav-links">
      <a href="/" class="btn btn-sm">Commandes</a>
      <button class="btn btn-sm" onclick="toggleStocks()">Stocks</button>
      <a href="/logout" class="btn btn-sm btn-ghost">Déconnexion</a>
    </div>
  </nav>

  <!-- Panneau stocks (masqué par défaut) -->
  <div id="stocks-panel" class="stocks-panel" style="display:none">
    <div class="stocks-inner container">
      <h3 class="stocks-title">Gestion des stocks</h3>
      <p class="stocks-hint">Laisser vide = illimité · 0 = épuisé</p>
      <div id="stocks-grid" class="stocks-grid"></div>
    </div>
  </div>

  <main class="container">
    <div class="kitchen-header">
      <h2 class="page-title">Cuisine</h2>
      <span id="order-count" class="order-count"></span>
    </div>
    <div id="orders-grid" class="orders-grid">
      <p class="empty-msg">Aucune commande pour le moment...</p>
    </div>
  </main>

  <script>
    (async () => {
      const res = await fetch('/orders');
      if (res.status === 401) window.location.href = '/pin.html';
    })();

    let orders  = [];
    let stocks  = {};
    let pizzas  = [];
    let tapas   = [];

    function getElapsed(timestamp) {
      return Math.floor((Date.now() - new Date(timestamp).getTime()) / 60000);
    }
    function getAgeClass(m) {
      return m >= 20 ? 'age-red' : m >= 10 ? 'age-orange' : 'age-neutral';
    }
    function formatTime(ts) { return ts.replace('T', ' ').slice(0, 16); }
    function esc(s) {
      return String(s ?? '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    // ── Commandes ──────────────────────────────────
    function renderOrders() {
      const grid = document.getElementById('orders-grid');
      const countEl = document.getElementById('order-count');
      if (orders.length === 0) {
        grid.innerHTML = '<p class="empty-msg">Aucune commande pour le moment...</p>';
        countEl.textContent = '';
        return;
      }
      const sorted = [...orders].sort((a, b) => a.timestamp.localeCompare(b.timestamp));
      countEl.textContent = `${sorted.length} commande${sorted.length > 1 ? 's' : ''}`;
      grid.innerHTML = sorted.map(order => {
        const minutes = getElapsed(order.timestamp);
        const ageClass = getAgeClass(minutes);
        const buzzerHtml = order.buzzer
          ? `<div class="order-buzzer">Bipeur <strong>${esc(order.buzzer)}</strong></div>` : '';
        const commentHtml = order.comment
          ? `<div class="order-comment">Note : ${esc(order.comment)}</div>` : '';
        const pizzaItems  = (order.pizzas || []).map(p => `<li>${esc(p)}</li>`).join('');
        const tapaItems   = (order.tapas  || []).map(t => `<li class="tapa-item">${esc(t)}</li>`).join('');
        const separator   = pizzaItems && tapaItems ? '<li class="list-sep"></li>' : '';
        return `
          <div class="order-card ${ageClass}">
            <div class="card-header">
              <span class="order-num">#${esc(order.id)}</span>
              <span class="order-time">${formatTime(order.timestamp)}</span>
              <span class="order-elapsed">${minutes} min</span>
            </div>
            <div class="order-client">${esc(order.client)}</div>
            ${buzzerHtml}
            <ul class="pizza-list">${pizzaItems}${separator}${tapaItems}</ul>
            ${commentHtml}
            <button class="btn btn-sm btn-reprint" onclick="reprint(${esc(order.id)})">Réimprimer</button>
          </div>`;
      }).join('');
    }

    window.reprint = async (id) => {
      try {
        const res = await fetch(`/print/${id}`, { method: 'POST' });
        if (!res.ok) alert('Erreur impression: ' + (await res.json()).error);
      } catch { alert('Erreur réseau'); }
    };

    // ── Stocks ─────────────────────────────────────
    window.toggleStocks = () => {
      const panel = document.getElementById('stocks-panel');
      const visible = panel.style.display !== 'none';
      panel.style.display = visible ? 'none' : 'block';
      if (!visible) renderStocksPanel();
    };

    async function loadStocks() {
      const res = await fetch('/stocks');
      if (res.ok) stocks = await res.json();
    }

    async function setStock(item, qty) {
      await fetch('/stocks', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item, qty: qty === '' ? null : Number(qty) })
      });
      await loadStocks();
      renderStocksPanel();
    }

    function renderStocksPanel() {
      const grid = document.getElementById('stocks-grid');
      const sections = [
        { label: '🍕 Pizzas', items: pizzas },
        { label: '🫙 Tapas',  items: tapas  }
      ];
      grid.innerHTML = sections.map(({ label, items }) => `
        <div class="stocks-section">
          <div class="stocks-section-label">${label}</div>
          ${items.map(item => {
            const qty = stocks[item];
            const epuise = qty !== null && qty !== undefined && qty === 0;
            return `
              <div class="stock-row${epuise ? ' epuise' : ''}">
                <span class="stock-name">${esc(item)}</span>
                <div class="stock-controls">
                  <button class="counter-btn minus" onclick="adjustStock('${esc(item)}',-1)">−</button>
                  <input class="stock-input" type="number" min="0"
                    value="${qty === null || qty === undefined ? '' : qty}"
                    placeholder="∞"
                    onchange="setStock('${esc(item)}', this.value)"
                    oninput="setStock('${esc(item)}', this.value)">
                  <button class="counter-btn plus" onclick="adjustStock('${esc(item)}',+1)">+</button>
                </div>
                ${epuise ? '<span class="epuise-badge">ÉPUISÉ</span>' : ''}
              </div>`;
          }).join('')}
        </div>`
      ).join('');
    }

    window.adjustStock = async (item, delta) => {
      const current = stocks[item];
      const base = current === null || current === undefined ? 99 : current;
      await setStock(item, Math.max(0, base + delta));
    };

    async function init() {
      const [rp, rt] = await Promise.all([fetch('/config-pizzas'), fetch('/config-tapas')]);
      if (rp.ok) pizzas = await rp.json();
      if (rt.ok) tapas  = await rt.json();
      await loadStocks();
    }

    // SSE
    const evtSource = new EventSource('/events');
    evtSource.onmessage = (e) => { orders = JSON.parse(e.data); renderOrders(); };
    evtSource.onerror   = () => console.warn('SSE retry...');

    setInterval(renderOrders, 60000);
    init();
  </script>
</body>
</html>
