<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIZZIA — Cuisine</title>
  <link rel="stylesheet" href="style.css">
  <script>(function(){var s=localStorage.getItem('pizzia-theme');document.documentElement.dataset.theme=s||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');})()</script>
</head>
<body>
  <nav class="navbar">
    <span class="logo">PIZZIA</span>
    <div class="nav-links">
      <span id="sse-dot" class="sse-dot" data-ok="true" title="Connexion active"></span>
      <a href="/" class="btn btn-sm">Commandes</a>
      <a href="/stats.html" class="btn btn-sm">Stats</a>
      <button id="theme-toggle" class="btn btn-sm btn-ghost" onclick="window.__themeToggle()" title="Changer le thème"></button>
      <a href="/logout" class="btn btn-sm btn-ghost">Déconnexion</a>
    </div>
  </nav>

  <!-- Panneau stocks (masqué par défaut) -->
  <div id="stocks-panel" class="stocks-panel">
    <div class="stocks-inner container">
      <h3 class="stocks-title">Gestion des stocks</h3>
      <p class="stocks-hint">Laisser vide = illimité · 0 = épuisé</p>
      <div id="stocks-grid" class="stocks-grid"></div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <main class="container">
    <div class="kitchen-header">
      <h2 class="page-title">Cuisine</h2>
      <span id="order-count" class="order-count"></span>
    </div>
    <div id="orders-grid" class="orders-grid">
      <p class="empty-msg">Aucune commande pour le moment...</p>
    </div>
  </main>

  <script>
    (async () => {
      const res = await fetch('/orders');
      if (res.status === 401) window.location.href = '/pin.html';
    })();

    let orders  = [];
    let stocks  = {};
    let pizzas  = [];
    let tapas   = [];

    function getElapsed(timestamp) {
      return Math.floor((Date.now() - new Date(timestamp).getTime()) / 60000);
    }
    function getAgeClass(m) {
      return m >= 20 ? 'age-red' : m >= 10 ? 'age-orange' : 'age-neutral';
    }
    function formatTime(ts) { return ts.replace('T', ' ').slice(0, 16); }
    function esc(s) {
      return String(s ?? '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    // ── Commandes ──────────────────────────────────
    function renderOrders() {
      const grid = document.getElementById('orders-grid');
      const countEl = document.getElementById('order-count');
      if (orders.length === 0) {
        grid.innerHTML = '<p class="empty-msg">Aucune commande pour le moment...</p>';
        countEl.textContent = '';
        return;
      }
      const sorted = [...orders].sort((a, b) => a.timestamp.localeCompare(b.timestamp));
      countEl.textContent = `${sorted.length} commande${sorted.length > 1 ? 's' : ''}`;
      grid.innerHTML = sorted.map(order => {
        const minutes = getElapsed(order.timestamp);
        const ageClass = getAgeClass(minutes);
        const buzzerHtml = order.buzzer
          ? `<div class="order-buzzer">Bipeur <strong>${esc(order.buzzer)}</strong></div>` : '';
        const commentHtml = order.comment
          ? `<div class="order-comment">Note : ${esc(order.comment)}</div>` : '';
        const pizzaItems  = (order.pizzas || []).map(p => `<li>${esc(p)}</li>`).join('');
        const tapaItems   = (order.tapas  || []).map(t => `<li class="tapa-item">${esc(t)}</li>`).join('');
        const separator   = pizzaItems && tapaItems ? '<li class="list-sep"></li>' : '';
        const printBadge  = order.printOk === false
          ? `<div class="print-fail-badge">⚠ Non imprimé</div>` : '';
        return `
          <div class="order-card ${ageClass}">
            <div class="card-header">
              <span class="order-num">#${esc(order.id)}</span>
              <span class="order-time">${formatTime(order.timestamp)}</span>
              <span class="order-elapsed">${minutes} min</span>
            </div>
            ${printBadge}
            <div class="order-client">${esc(order.client)}</div>
            ${buzzerHtml}
            <ul class="pizza-list">${pizzaItems}${separator}${tapaItems}</ul>
            ${commentHtml}
            <button class="btn btn-sm btn-reprint" data-id="${esc(order.id)}">Réimprimer</button>
          </div>`;
      }).join('');
    }

    // ── Toasts ─────────────────────────────────────
    function showToast({ type, message }) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      const icons = { green: '✓', orange: '⚠', red: '✗' };
      toast.innerHTML = `
        <span class="toast-icon">${icons[type]}</span>
        <span class="toast-msg">${message}</span>
        <button class="toast-close">×</button>`;
      toast.querySelector('.toast-close').addEventListener('click', () => dismissToast(toast));
      container.appendChild(toast);
      if (type !== 'orange') setTimeout(() => dismissToast(toast), 5000);
    }
    function dismissToast(toast) {
      toast.classList.add('toast-out');
      setTimeout(() => toast.remove(), 300);
    }

    // ── Réimpression ────────────────────────────────
    document.getElementById('orders-grid').addEventListener('click', async e => {
      const btn = e.target.closest('.btn-reprint');
      if (!btn) return;
      const id = Number(btn.dataset.id);
      btn.disabled = true;
      btn.textContent = 'Impression…';
      try {
        const res = await fetch(`/print/${id}`, { method: 'POST' });
        if (res.ok) {
          showToast({ type: 'green', message: 'Ticket réimprimé !' });
          const r = await fetch('/orders');
          if (r.ok) { orders = await r.json(); renderOrders(); }
        } else {
          const err = await res.json();
          showToast({ type: 'red', message: 'Erreur impression : ' + err.error });
          btn.disabled = false;
          btn.textContent = 'Réimprimer';
        }
      } catch {
        showToast({ type: 'red', message: 'Erreur réseau' });
        btn.disabled = false;
        btn.textContent = 'Réimprimer';
      }
    });

    // ── Stocks ─────────────────────────────────────
    async function loadStocks() {
      const res = await fetch('/stocks');
      if (res.ok) stocks = await res.json();
    }

    async function setStock(item, qty) {
      await fetch('/stocks', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item, qty: qty === '' ? null : Number(qty) })
      });
      await loadStocks();
      renderStocksPanel();
    }

    function renderStocksPanel() {
      const grid = document.getElementById('stocks-grid');
      const sections = [
        { label: '🍕 Pizzas', items: pizzas },
        { label: '🫙 Tapas',  items: tapas  }
      ];
      grid.innerHTML = sections.map(({ label, items }) => `
        <div class="stocks-section">
          <div class="stocks-section-label">${label}</div>
          ${items.map(item => {
            const qty = stocks[item];
            const epuise = qty !== null && qty !== undefined && qty === 0;
            return `
              <div class="stock-row${epuise ? ' epuise' : ''}">
                <span class="stock-name">${esc(item)}</span>
                <div class="stock-controls">
                  <button class="counter-btn minus" data-item="${esc(item)}" data-delta="-1">−</button>
                  <input class="stock-input" type="number" min="0" step="1"
                    value="${qty === null || qty === undefined ? '' : qty}"
                    placeholder="∞"
                    data-item="${esc(item)}">
                  <button class="counter-btn plus" data-item="${esc(item)}" data-delta="1">+</button>
                </div>
                ${epuise ? '<span class="epuise-badge">ÉPUISÉ</span>' : ''}
              </div>`;
          }).join('')}
        </div>`
      ).join('');
    }

    document.getElementById('stocks-grid').addEventListener('click', async e => {
      const btn = e.target.closest('[data-delta]');
      if (!btn) return;
      const item = btn.dataset.item;
      const delta = Number(btn.dataset.delta);
      const current = stocks[item];
      const base = current === null || current === undefined ? 99 : current;
      await setStock(item, Math.max(0, base + delta));
    });

    document.getElementById('stocks-grid').addEventListener('change', async e => {
      const input = e.target.closest('.stock-input');
      if (!input) return;
      await setStock(input.dataset.item, input.value);
    });

    async function init() {
      const [rp, rt] = await Promise.all([fetch('/config-pizzas'), fetch('/config-tapas')]);
      if (rp.ok) pizzas = await rp.json();
      if (rt.ok) tapas  = await rt.json();
      await loadStocks();
      renderStocksPanel();
    }

    // SSE
    let sseOk = true;
    let sseErrorTimer = null;

    function setSseStatus(ok) {
      if (ok === sseOk) return;
      sseOk = ok;
      const dot = document.getElementById('sse-dot');
      if (dot) { dot.title = ok ? 'Connexion active' : 'Connexion perdue — reconnexion…'; dot.dataset.ok = ok; }
    }

    const evtSource = new EventSource('/events');
    evtSource.onmessage = (e) => {
      clearTimeout(sseErrorTimer);
      setSseStatus(true);
      orders = JSON.parse(e.data);
      renderOrders();
    };
    evtSource.onerror = () => {
      sseErrorTimer = setTimeout(() => setSseStatus(false), 5000);
    };

    setInterval(renderOrders, 60000);
    init();
  </script>
  <script src="theme.js"></script>
</body>
</html>
